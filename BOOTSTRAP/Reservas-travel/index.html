<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1>Hello, World!</h1>
     <!-- DESTINOS -->
                <section class="destinations-section px-4 px-lg-5">

                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">

                        <div>

                            <p class="section-kicker mb-1">
                                INSPÍRATE
                            </p>

                            <h2 class="section-title mb-0">
                                Destinos para soñar
                            </h2>

                        </div>

                        <span class="see-all">
                            Explorar destinos →
                        </span>

                    </div>


                    <div class="row g-4">

                        <!-- GRECIA -->
                        <div class="col-md-4">

                            <article class="destination-card">

                                <img
                                    src="https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=900&q=85"
                                    alt="Islas griegas">

                                <div class="destination-info">

                                    <span class="destination-type">
                                        MAR Y CULTURA
                                    </span>

                                    <h3>Islas griegas</h3>

                                    <p>
                                        Playas, pueblos blancos y aguas cristalinas.
                                    </p>

                                    <div class="d-flex justify-content-between align-items-center">

                                        <strong>Desde 649 €</strong>

                                        <span class="btn detail-btn">
                                            Ver viaje
                                        </span>

                                    </div>

                                </div>

                            </article>

                        </div>


                        <!-- ITALIA -->
                        <div class="col-md-4">

                            <article class="destination-card">

                                <img
                                    src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=900&q=85"
                                    alt="Costa italiana">

                                <div class="destination-info">

                                    <span class="destination-type">
                                        ESCAPADA
                                    </span>

                                    <h3>Costa italiana</h3>

                                    <p>
                                        Pequeños pueblos y gastronomía mediterránea.
                                    </p>

                                    <div class="d-flex justify-content-between align-items-center">

                                        <strong>Desde 529 €</strong>

                                        <span class="btn detail-btn">
                                            Ver viaje
                                        </span>

                                    </div>

                                </div>

                            </article>

                        </div>
</body>
</html>
